[project]
name = "trading-bot"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "pandas>=2.0"]

[project.optional-dependencies]
moomoo = ["moomoo-api"]
webull = ["webull-openapi-python-sdk"]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
